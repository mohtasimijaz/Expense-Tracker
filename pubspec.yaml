name: expense_tracker
description: "Expense Tracker - track spending, budgets and statistics with offline storage."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# version: <versionName>+<versionCode>. Keep lib/constants/app_info.dart in sync
# (test/app_info_test.dart fails if they drift apart).
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management
  provider: ^6.1.5+1

  # UI enhancement
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.3
  fl_chart: ^1.2.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  shared_preferences: ^2.5.5

  # Firebase
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  firebase_analytics: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/

# App icon generation: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#4F46E5"
    theme_color: "#4F46E5"
